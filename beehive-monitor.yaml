# ESPHome Beehive Monitoring Package
#
# Battery-powered ESP32 beehive monitor with:
# - INMP441 microphone for FFT-based audio analysis
# - NAU7802 ADC for 4x 50kg load cells (weight)
# - SHT40 temperature and humidity sensor
# - Deep sleep for power efficiency (5 minute intervals)
#
# Usage: Include this as a package in your device configuration.
# See README.md for setup instructions.

substitutions:
  # I2C bus ID (user must define the i2c bus externally)
  i2c_bus_id: i2c_bus
  # I2S pins for INMP441 microphone
  i2s_lrclk_pin: GPIO1
  i2s_bclk_pin: GPIO3
  i2s_din_pin: GPIO7
  # GPIO pin to prevent deep sleep when held high at boot
  prevent_sleep_pin: GPIO11
  # GPIO pin that controls power to all sensors (e.g. FeatherS3D LDO2)
  sensor_power_pin: GPIO39
  # INA226 I2C addresses
  ina226_solar_address: "0x40"
  ina226_battery_address: "0x45"
  # Weight calibration points (raw_value -> weight_kg)
  # Record raw values at known weights and update these
  weight_cal_raw_1: "-242624"
  weight_cal_kg_1: "0"
  weight_cal_raw_2: "-241661"
  weight_cal_kg_2: "1.081"
  weight_cal_raw_3: "-240884"
  weight_cal_kg_3: "2.493"
  weight_cal_raw_4: "-238628"
  weight_cal_kg_4: "3.574"

esphome:
  on_boot:
    - priority: 750 # After GPIO switch setup (800) but before I2C sensor setup (600)
      then:
        - logger.log: "Powering on sensor rail (LDO2)"
        - switch.turn_on: sensor_power
        - delay: 500ms
    - priority: -100 # Run after all components initialised
      then:
        - if:
            condition:
              binary_sensor.is_on: prevent_sleep_pin
            then:
              - logger.log: "Prevent sleep pin is high - disabling deep sleep"
              - switch.turn_on: prevent_deep_sleep
        - script.execute: collect_and_sleep

external_components:
  - source: github://johnf/esphome-beehive
    components: [bee_audio]
    refresh: 0s

# Deep sleep configuration - 5 minute intervals
deep_sleep:
  id: deep_sleep_control
  run_duration: 45s # Max awake time before forced sleep
  sleep_duration: 5min

# Custom bee audio component (INMP441 microphone)
# Pins (configured via substitutions):
#   - LRCLK (WS): GPIO1 (i2s_lrclk_pin)
#   - BCLK (SCK): GPIO3 (i2s_bclk_pin)
#   - DIN (SD):   GPIO7 (i2s_din_pin)
#   - VDD:        3.3V
#   - GND:        GND
#   - L/R:        GND (left channel)
bee_audio:
  id: bee_monitor
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  sample_rate: 8000
  fft_size: 2048
  update_interval: never

sensor:
  # Bee audio frequency bands (power in dB)
  - platform: bee_audio
    bee_audio_id: bee_monitor
    band_low_freq:
      name: "Bee Low Frequency (60-100Hz)"
      id: bee_low_freq
    band_baseline:
      name: "Bee Baseline Hum (100-200Hz)"
      id: bee_baseline
    band_worker:
      name: "Bee Worker Activity (180-260Hz)"
      id: bee_worker
    band_quacking:
      name: "Bee Queen Quacking (200-350Hz)"
      id: bee_quacking
    band_tooting:
      name: "Bee Queen Tooting (350-500Hz)"
      id: bee_tooting
    band_queenless_mid:
      name: "Bee Queenless Mid (478-677Hz)"
      id: bee_queenless_mid
    band_queenless_high:
      name: "Bee Queenless High (876-1080Hz)"
      id: bee_queenless_high
    dominant_frequency:
      name: "Bee Dominant Frequency"
      id: bee_dominant_freq
    sound_level_rms:
      name: "Bee Sound Level"
      id: bee_sound_level
    spectral_centroid:
      name: "Bee Spectral Centroid"
      id: bee_spectral_centroid

  # NAU7802 load cell ADC (hive weight)
  # Calibration: Adjust the calibrate_linear filter based on your load cells
  # 1. Record raw value with empty hive
  # 2. Record raw value with known weight
  # 3. Update the linear calibration
  - platform: nau7802
    i2c_id: ${i2c_bus_id}
    id: hive_weight
    name: "Hive Weight"
    gain: 128
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    update_interval: never
    filters:
      - calibrate_linear:
          - ${weight_cal_raw_1} -> ${weight_cal_kg_1}
          - ${weight_cal_raw_2} -> ${weight_cal_kg_2}
          - ${weight_cal_raw_3} -> ${weight_cal_kg_3}
          - ${weight_cal_raw_4} -> ${weight_cal_kg_4}

  # SHT40 temperature and humidity
  - platform: sht4x
    i2c_id: ${i2c_bus_id}
    id: hive_climate
    update_interval: never
    temperature:
      name: "Hive Temperature"
      id: hive_temp
    humidity:
      name: "Hive Humidity"
      id: hive_humidity

  # INA226 current/voltage/power monitors
  # Solar panel side - monitors incoming solar power
  - platform: ina226
    i2c_id: ${i2c_bus_id}
    address: ${ina226_solar_address}
    id: ina226_solar
    update_interval: never
    current:
      name: "Solar Current"
      id: solar_current
    power:
      name: "Solar Power"
      id: solar_power
    bus_voltage:
      name: "Solar Bus Voltage"
      id: solar_bus_voltage
    shunt_voltage:
      name: "Solar Shunt Voltage"
      id: solar_shunt_voltage

  # Battery side - monitors battery charge/discharge
  - platform: ina226
    i2c_id: ${i2c_bus_id}
    address: ${ina226_battery_address}
    id: ina226_battery
    update_interval: never
    current:
      name: "Battery Current"
      id: battery_current
    power:
      name: "Battery Power"
      id: battery_power
    bus_voltage:
      name: "Battery Bus Voltage"
      id: battery_bus_voltage
    shunt_voltage:
      name: "Battery Shunt Voltage"
      id: battery_shunt_voltage

  # Battery level estimated from INA226 bus voltage using a LiPo discharge curve.
  # Based on a single-cell 3.7V 2000mAh LiPo with DW01+ PCM:
  #   - Over-charge protection:  4.30V (PCM cuts charging)
  #   - Over-discharge protection: 2.4V (PCM cuts load)
  #   - Practical low: ~3.0V to preserve cell longevity
  # These points approximate the non-linear LiPo discharge curve - adjust
  # if your observed values differ from expected SoC.
  - platform: copy
    source_id: battery_bus_voltage
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    filters:
      - calibrate_linear:
          - 2.50 -> 0
          - 3.00 -> 1
          - 3.30 -> 5
          - 3.50 -> 10
          - 3.60 -> 20
          - 3.70 -> 40
          - 3.75 -> 50
          - 3.80 -> 60
          - 3.85 -> 70
          - 3.90 -> 80
          - 4.00 -> 90
          - 4.10 -> 95
          - 4.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  # Battery voltage via ADC is not used - the board's JST connector and
  # onboard fuel gauge (MAX17048) cannot be used as the CN3065 solar
  # charge controller would conflict with the FeatherS3's onboard charger.
  # Power is fed directly to the 3.3V pin instead.
  # - platform: adc
  #   pin: GPIO34
  #   name: "Battery Voltage"
  #   id: battery_voltage_adc
  #   attenuation: 11db
  #   filters:
  #     - multiply: 2.0  # Voltage divider ratio

binary_sensor:
  - platform: gpio
    pin:
      number: ${prevent_sleep_pin}
      mode:
        input: true
        pulldown: true
    name: "Prevent Sleep Pin"
    id: prevent_sleep_pin
    internal: true
  - platform: bee_audio
    bee_audio_id: bee_monitor
    queen_piping:
      name: "Queen Piping Detected"
      id: queen_piping

text_sensor:
  - platform: bee_audio
    bee_audio_id: bee_monitor
    hive_state:
      name: "Hive State"
      id: hive_state

switch:
  # Sensor power switch - controls power to all sensors via GPIO
  # On FeatherS3D this is LDO2 (GPIO39), automatically off during deep sleep
  - platform: gpio
    id: sensor_power
    pin: ${sensor_power_pin}
    name: "Sensor Power"
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
    on_turn_off:
      - deep_sleep.allow: deep_sleep_control

script:
  - id: collect_and_sleep
    then:
      - logger.log: "Starting measurement cycle"
      - switch.turn_on: sensor_power
      - logger.log: "Sensor power on - waiting for stabilisation"
      - delay: 500ms
      - wait_until:
          condition:
            wifi.connected:
          timeout: 10s
      - component.update: bee_monitor
      - component.update: hive_weight
      - component.update: hive_climate
      - component.update: ina226_solar
      - component.update: ina226_battery
      - wait_until:
          condition:
            api.connected:
          timeout: 10s
      - delay: 300ms
      - if:
          condition:
            switch.is_on: prevent_deep_sleep
          then:
            # Keep sensors powered in prevent-sleep mode - power cycling
            # would lose NAU7802 register state (gain, LDO, calibration)
            # which is only restored during setup() at boot
            - logger.log: "Deep sleep prevented - staying awake"
            - delay: 5min
            - script.execute: collect_and_sleep
          else:
            - switch.turn_off: sensor_power
            - logger.log: "BeeHive: Entering deep sleep"
            - deep_sleep.enter: deep_sleep_control
