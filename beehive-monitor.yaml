# ESPHome Beehive Monitoring Package
#
# Battery-powered ESP32 beehive monitor with:
# - INMP441 microphone for FFT-based audio analysis
# - NAU7802 ADC for 4x 50kg load cells (weight)
# - SHT40 temperature and humidity sensor
# - 2x INA226 for solar and battery power monitoring
# - Deep sleep for power efficiency (5 minute intervals)
#
# Usage: Include this as a package in your device configuration.
# See README.md for setup instructions.

substitutions:
  # Where to fetch the bee_audio component from. Pinned to a release tag; keep
  # it in step with the @tag on the package URL in your device configuration.
  # Set to a local path (e.g. "components") when building from a checkout.
  bee_audio_source: github://johnf/esphome-beehive@v1.0.0
  # I2C bus ID (user must define the i2c bus externally)
  i2c_bus_id: i2c_bus
  # I2S pins for INMP441 microphone
  i2s_lrclk_pin: GPIO1
  i2s_bclk_pin: GPIO3
  i2s_din_pin: GPIO7
  # GPIO pin to prevent deep sleep when held high at boot
  prevent_sleep_pin: GPIO11
  # GPIO pin that controls power to all sensors (e.g. FeatherS3D LDO2)
  sensor_power_pin: GPIO39
  # INA226 I2C addresses
  ina226_solar_address: "0x40"
  ina226_battery_address: "0x45"
  # Solar current (A) above which the battery is considered charging. While
  # charging, bus voltage reflects the charger rather than state of charge, so
  # the battery level estimate is held at its last value.
  charging_current_threshold: "0.02"
  # Audio analysis. Band levels are mean power spectral density in dB re
  # full-scale^2/Hz, independent of fft_size. See README "Audio Baseline".
  audio_frames: "4"
  audio_queenless_threshold: "6dB"
  audio_queen_piping_threshold: "10dB"
  audio_active_threshold: "-95dB"
  audio_normal_threshold: "-105dB"
  audio_pre_swarm_centroid: "400Hz"
  # Weight calibration points (raw_value -> weight_kg). Record the raw value
  # with the platform empty and again with a known weight of at least 20 kg
  # (see README "Load Cell Calibration"). The defaults below are placeholders
  # from a bench test and will not match your load cells.
  weight_cal_raw_1: "-242624"
  weight_cal_kg_1: "0"
  weight_cal_raw_2: "-241661"
  weight_cal_kg_2: "1.081"
  weight_cal_raw_3: "-240884"
  weight_cal_kg_3: "2.493"
  weight_cal_raw_4: "-238628"
  weight_cal_kg_4: "3.574"

esphome:
  on_boot:
    - priority: 750 # After GPIO switch setup (800) but before I2C sensor setup (600)
      then:
        - logger.log: "Powering on sensor rail (LDO2)"
        - switch.turn_on: sensor_power
        - delay: 500ms
    - priority: -100 # Run after all components initialised
      then:
        - if:
            condition:
              binary_sensor.is_on: prevent_sleep_pin
            then:
              - logger.log: "Prevent sleep pin is high - disabling deep sleep"
              - switch.turn_on: prevent_deep_sleep
        - script.execute: collect_and_sleep

external_components:
  - source: ${bee_audio_source}
    components: [bee_audio]
    refresh: 1d

# Deep sleep configuration - 5 minute intervals
deep_sleep:
  id: deep_sleep_control
  run_duration: 45s # Max awake time before forced sleep
  sleep_duration: 5min

# Custom bee audio component (INMP441 microphone)
# Pins (configured via substitutions):
#   - LRCLK (WS): GPIO1 (i2s_lrclk_pin)
#   - BCLK (SCK): GPIO3 (i2s_bclk_pin)
#   - DIN (SD):   GPIO7 (i2s_din_pin)
#   - VDD:        3.3V
#   - GND:        GND
#   - L/R:        GND (left channel)
bee_audio:
  id: bee_monitor
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  sample_rate: 8000
  fft_size: 2048
  # Number of consecutive FFT frames averaged per reading (~256ms each)
  frames: ${audio_frames}
  queenless_threshold: ${audio_queenless_threshold}
  queen_piping_threshold: ${audio_queen_piping_threshold}
  active_threshold: ${audio_active_threshold}
  normal_threshold: ${audio_normal_threshold}
  pre_swarm_centroid: ${audio_pre_swarm_centroid}
  update_interval: never

sensor:
  # Bee audio frequency bands (power in dB)
  - platform: bee_audio
    bee_audio_id: bee_monitor
    band_low_freq:
      name: "Bee Low Frequency (60-100Hz)"
      id: bee_low_freq
    band_baseline:
      name: "Bee Baseline Hum (100-200Hz)"
      id: bee_baseline
    band_worker:
      name: "Bee Worker Activity (180-260Hz)"
      id: bee_worker
    band_quacking:
      name: "Bee Queen Quacking (200-350Hz)"
      id: bee_quacking
    band_tooting:
      name: "Bee Queen Tooting (350-500Hz)"
      id: bee_tooting
    band_queenless_mid:
      name: "Bee Queenless Mid (478-677Hz)"
      id: bee_queenless_mid
    band_queenless_high:
      name: "Bee Queenless High (876-1080Hz)"
      id: bee_queenless_high
    dominant_frequency:
      name: "Bee Dominant Frequency"
      id: bee_dominant_freq
    sound_level_rms:
      name: "Bee Sound Level"
      id: bee_sound_level
    spectral_centroid:
      name: "Bee Spectral Centroid"
      id: bee_spectral_centroid

  # NAU7802 load cell ADC (hive weight)
  # The measurement script reads 7 samples per wake; the median of the first 5
  # is published so a single noisy or not-ready read cannot skew the result.
  - platform: nau7802
    i2c_id: ${i2c_bus_id}
    id: hive_weight
    name: "Hive Weight"
    gain: 128
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    update_interval: never
    filters:
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 5
      - calibrate_linear:
          - ${weight_cal_raw_1} -> ${weight_cal_kg_1}
          - ${weight_cal_raw_2} -> ${weight_cal_kg_2}
          - ${weight_cal_raw_3} -> ${weight_cal_kg_3}
          - ${weight_cal_raw_4} -> ${weight_cal_kg_4}

  # SHT40 temperature and humidity
  - platform: sht4x
    i2c_id: ${i2c_bus_id}
    id: hive_climate
    update_interval: never
    temperature:
      name: "Hive Temperature"
      id: hive_temp
    humidity:
      name: "Hive Humidity"
      id: hive_humidity

  # INA226 current/voltage/power monitors
  # Solar panel side - monitors incoming solar power
  - platform: ina226
    i2c_id: ${i2c_bus_id}
    address: ${ina226_solar_address}
    id: ina226_solar
    update_interval: never
    current:
      name: "Solar Current"
      id: solar_current
    power:
      name: "Solar Power"
      id: solar_power
    bus_voltage:
      name: "Solar Bus Voltage"
      id: solar_bus_voltage
    shunt_voltage:
      name: "Solar Shunt Voltage"
      id: solar_shunt_voltage

  # Battery side - monitors battery charge/discharge
  - platform: ina226
    i2c_id: ${i2c_bus_id}
    address: ${ina226_battery_address}
    id: ina226_battery
    update_interval: never
    current:
      name: "Battery Current"
      id: battery_current
    power:
      name: "Battery Power"
      id: battery_power
    bus_voltage:
      name: "Battery Bus Voltage"
      id: battery_bus_voltage
    shunt_voltage:
      name: "Battery Shunt Voltage"
      id: battery_shunt_voltage

  # Battery level estimated from INA226 bus voltage using a LiPo discharge curve.
  # Based on a single-cell 3.7V 2000mAh LiPo with DW01+ PCM:
  #   - Over-charge protection:  4.30V (PCM cuts charging)
  #   - Over-discharge protection: 2.4V (PCM cuts load)
  #   - Practical low: ~3.0V to preserve cell longevity
  # These points approximate the non-linear LiPo discharge curve - adjust
  # if your observed values differ from expected SoC.
  # Skipped while charging: the CN3065 holds the bus near 4.2V regardless of
  # state of charge, so Home Assistant keeps the last resting-voltage estimate.
  - platform: copy
    source_id: battery_bus_voltage
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery"
    filters:
      - lambda: |-
          if (id(solar_current).has_state() &&
              fabsf(id(solar_current).state) > ${charging_current_threshold}) {
            return {};
          }
          return x;
      - calibrate_linear:
          method: exact
          datapoints:
          - 2.50 -> 0
          - 3.00 -> 1
          - 3.30 -> 5
          - 3.50 -> 10
          - 3.60 -> 20
          - 3.70 -> 40
          - 3.75 -> 50
          - 3.80 -> 60
          - 3.85 -> 70
          - 3.90 -> 80
          - 4.00 -> 90
          - 4.10 -> 95
          - 4.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  # Battery voltage via ADC is not used - the board's JST connector and
  # onboard fuel gauge (MAX17048) cannot be used as the CN3065 solar
  # charge controller would conflict with the FeatherS3's onboard charger.
  # Power is fed directly to the 3.3V pin instead.
  # - platform: adc
  #   pin: GPIO34
  #   name: "Battery Voltage"
  #   id: battery_voltage_adc
  #   attenuation: 11db
  #   filters:
  #     - multiply: 2.0  # Voltage divider ratio

binary_sensor:
  - platform: gpio
    pin:
      number: ${prevent_sleep_pin}
      mode:
        input: true
        pulldown: true
    name: "Prevent Sleep Pin"
    id: prevent_sleep_pin
    internal: true
  - platform: bee_audio
    bee_audio_id: bee_monitor
    queen_piping:
      name: "Queen Piping Detected"
      id: queen_piping
  - platform: template
    name: "Battery Charging"
    id: battery_charging
    device_class: battery_charging
    lambda: |-
      if (!id(solar_current).has_state()) return false;
      return fabsf(id(solar_current).state) > ${charging_current_threshold};

text_sensor:
  - platform: bee_audio
    bee_audio_id: bee_monitor
    hive_state:
      name: "Hive State"
      id: hive_state

switch:
  # Sensor power switch - controls power to all sensors via GPIO
  # On FeatherS3D this is LDO2 (GPIO39), automatically off during deep sleep
  - platform: gpio
    id: sensor_power
    pin: ${sensor_power_pin}
    name: "Sensor Power"
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
    on_turn_off:
      - deep_sleep.allow: deep_sleep_control

script:
  - id: collect_and_sleep
    then:
      - logger.log: "Starting measurement cycle"
      - wait_until:
          condition:
            wifi.connected:
          timeout: 10s
      - component.update: bee_monitor
      # NAU7802 produces a sample every 100ms at the default 10 SPS
      - repeat:
          count: 7
          then:
            - component.update: hive_weight
            - delay: 120ms
      - component.update: hive_climate
      - component.update: ina226_solar
      - component.update: ina226_battery
      - wait_until:
          condition:
            api.connected:
          timeout: 10s
      - delay: 300ms
      - if:
          condition:
            switch.is_on: prevent_deep_sleep
          then:
            # Sensor rail stays on: power cycling would lose NAU7802 register
            # state (gain, LDO, calibration) which is only set in setup()
            - logger.log: "Deep sleep prevented - staying awake"
            - delay: 5min
            - script.execute: collect_and_sleep
          else:
            - switch.turn_off: sensor_power
            - logger.log: "BeeHive: Entering deep sleep"
            - deep_sleep.enter: deep_sleep_control
