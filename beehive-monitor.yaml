# ESPHome Beehive Monitoring Package
#
# Battery-powered ESP32 beehive monitor with:
# - INMP441 microphone for FFT-based audio analysis
# - NAU7802 ADC for 4x 50kg load cells (weight)
# - SHT40 temperature and humidity sensor
# - INA226 for solar power monitoring, onboard MAX17048 fuel gauge for battery
# - Deep sleep for power efficiency (5 minute intervals)
#
# Usage: Include this as a package in your device configuration.
# See README.md for setup instructions.

substitutions:
  # Where to fetch the bee_audio component from. Unpinned, so it tracks the
  # default branch. Set to a local path (e.g. "components") when building from
  # a checkout.
  bee_audio_source: github://johnf/esphome-beehive
  # I2C bus ID (user must define the i2c bus externally)
  i2c_bus_id: i2c_bus
  # I2S pins for INMP441 microphone
  i2s_lrclk_pin: GPIO1
  i2s_bclk_pin: GPIO3
  i2s_din_pin: GPIO7
  # Home Assistant boolean helper that keeps the device awake for OTA updates
  ota_mode_entity: input_boolean.beehive_ota_mode
  # Longest the device stays awake in OTA mode before clearing the helper
  ota_mode_max_awake: 30min
  # GPIO pin that controls power to all sensors (e.g. FeatherS3D LDO2)
  sensor_power_pin: GPIO39
  # INA226 I2C address (A0 and A1 pulled low on the CJMCU-226 module)
  ina226_solar_address: "0x40"
  # Solar current (A) above which the battery is considered charging
  charging_current_threshold: "0.02"
  # Audio analysis. Band levels are mean power spectral density in dB re
  # full-scale^2/Hz, independent of fft_size. See README "Audio Baseline".
  audio_frames: "4"
  audio_queenless_threshold: "6dB"
  audio_queen_piping_threshold: "10dB"
  audio_active_threshold: "-95dB"
  audio_normal_threshold: "-105dB"
  audio_pre_swarm_centroid: "400Hz"
  # Seconds of audio for the modulation spectrum (colony strength proxy).
  # Longer is steadier but the device stays awake for the whole capture.
  audio_modulation_duration: "10s"
  # Weight calibration points (raw_value -> weight_kg). Record the raw value
  # with the platform empty and again with a known weight of at least 20 kg
  # (see README "Load Cell Calibration"). The defaults below are placeholders
  # from a bench test and will not match your load cells.
  weight_cal_raw_1: "-242624"
  weight_cal_kg_1: "0"
  weight_cal_raw_2: "-241661"
  weight_cal_kg_2: "1.081"
  weight_cal_raw_3: "-240884"
  weight_cal_kg_3: "2.493"
  weight_cal_raw_4: "-238628"
  weight_cal_kg_4: "3.574"

esphome:
  on_boot:
    - priority: 750 # After GPIO switch setup (800) but before I2C sensor setup (600)
      then:
        - logger.log: "Powering on sensor rail (LDO2)"
        - switch.turn_on: sensor_power
        - delay: 500ms
    - priority: -100 # Run after all components initialised
      then:
        - script.execute: collect_and_sleep

external_components:
  - source: ${bee_audio_source}
    components: [bee_audio]
    # Re-fetch on every run rather than trusting the cache
    refresh: always

# Deep sleep configuration - 5 minute intervals
deep_sleep:
  id: deep_sleep_control
  run_duration: 60s # Max awake time before forced sleep
  sleep_duration: 5min

ota:
  - platform: esphome
    id: ota_esphome
    on_begin:
      - switch.turn_on: prevent_deep_sleep

# Custom bee audio component (INMP441 microphone)
# Pins (configured via substitutions):
#   - LRCLK (WS): GPIO1 (i2s_lrclk_pin)
#   - BCLK (SCK): GPIO3 (i2s_bclk_pin)
#   - DIN (SD):   GPIO7 (i2s_din_pin)
#   - VDD:        3.3V
#   - GND:        GND
#   - L/R:        GND (left channel)
bee_audio:
  id: bee_monitor
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  sample_rate: 8000
  fft_size: 2048
  # Number of consecutive FFT frames averaged per reading (~256ms each)
  frames: ${audio_frames}
  queenless_threshold: ${audio_queenless_threshold}
  queen_piping_threshold: ${audio_queen_piping_threshold}
  active_threshold: ${audio_active_threshold}
  normal_threshold: ${audio_normal_threshold}
  pre_swarm_centroid: ${audio_pre_swarm_centroid}
  modulation_duration: ${audio_modulation_duration}
  update_interval: never

sensor:
  # Bee audio frequency bands (power in dB)
  - platform: bee_audio
    bee_audio_id: bee_monitor
    band_low_freq:
      name: "Bee Low Frequency (60-100Hz)"
      id: bee_low_freq
    band_baseline:
      name: "Bee Baseline Hum (100-200Hz)"
      id: bee_baseline
    band_worker:
      name: "Bee Worker Activity (180-260Hz)"
      id: bee_worker
    band_quacking:
      name: "Bee Queen Quacking (200-350Hz)"
      id: bee_quacking
    band_tooting:
      name: "Bee Queen Tooting (350-500Hz)"
      id: bee_tooting
    band_queenless_mid:
      name: "Bee Queenless Mid (478-677Hz)"
      id: bee_queenless_mid
    band_queenless_high:
      name: "Bee Queenless High (876-1080Hz)"
      id: bee_queenless_high
    dominant_frequency:
      name: "Bee Dominant Frequency"
      id: bee_dominant_freq
    sound_level_rms:
      name: "Bee Sound Level"
      id: bee_sound_level
    spectral_centroid:
      name: "Bee Spectral Centroid"
      id: bee_spectral_centroid
    modulation_index:
      name: "Bee Modulation Index"
      id: bee_modulation_index
    modulation_frequency:
      name: "Bee Modulation Frequency"
      id: bee_modulation_frequency

  # NAU7802 load cell ADC (hive weight)
  # The measurement script reads 7 samples per wake; the median of the first 5
  # is published so a single noisy or not-ready read cannot skew the result.
  - platform: nau7802
    i2c_id: ${i2c_bus_id}
    id: hive_weight
    name: "Hive Weight"
    gain: 128
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    update_interval: never
    filters:
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 5
      - calibrate_linear:
          - ${weight_cal_raw_1} -> ${weight_cal_kg_1}
          - ${weight_cal_raw_2} -> ${weight_cal_kg_2}
          - ${weight_cal_raw_3} -> ${weight_cal_kg_3}
          - ${weight_cal_raw_4} -> ${weight_cal_kg_4}

  # SHT40 temperature and humidity
  - platform: sht4x
    i2c_id: ${i2c_bus_id}
    id: hive_climate
    update_interval: never
    temperature:
      name: "Hive Temperature"
      id: hive_temp
    humidity:
      name: "Hive Humidity"
      id: hive_humidity

  # INA226 current/voltage/power monitors
  # Solar panel side - monitors incoming solar power
  - platform: ina226
    i2c_id: ${i2c_bus_id}
    address: ${ina226_solar_address}
    id: ina226_solar
    update_interval: never
    current:
      name: "Solar Current"
      id: solar_current
    power:
      name: "Solar Power"
      id: solar_power
    bus_voltage:
      name: "Solar Bus Voltage"
      id: solar_bus_voltage
    shunt_voltage:
      name: "Solar Shunt Voltage"
      id: solar_shunt_voltage

  # Battery voltage and state of charge from the FeatherS3D's onboard MAX17048
  # fuel gauge (register-compatible with the MAX17043). It is on the always-on
  # LDO1 rail, so its ModelGauge state survives deep sleep.
  - platform: max17043
    i2c_id: ${i2c_bus_id}
    id: fuel_gauge
    update_interval: never
    battery_voltage:
      name: "Battery Voltage"
      id: battery_voltage
    battery_level:
      name: "Battery Level"
      id: battery_level

binary_sensor:
  # Home Assistant pushes the helper state as soon as the API connects, so the
  # device sees it on every wake without an automation racing the sleep timer
  - platform: homeassistant
    id: ota_mode
    entity_id: ${ota_mode_entity}
    # Every wake is a fresh boot, so the helper state is always an initial
    # state; without this on_state never fires and the device sleeps anyway
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            binary_sensor.is_on: ota_mode
          then:
            - switch.turn_on: prevent_deep_sleep
          else:
            - if:
                condition:
                  switch.is_on: prevent_deep_sleep
                then:
                  - switch.turn_off: prevent_deep_sleep
                  # Restart the cycle so the device sleeps now, not in 5 minutes
                  - script.stop: collect_and_sleep
                  - script.execute: collect_and_sleep
  - platform: bee_audio
    bee_audio_id: bee_monitor
    queen_piping:
      name: "Queen Piping Detected"
      id: queen_piping
  - platform: template
    name: "Battery Charging"
    id: battery_charging
    device_class: battery_charging
    lambda: |-
      if (!id(solar_current).has_state()) return false;
      return fabsf(id(solar_current).state) > ${charging_current_threshold};

text_sensor:
  - platform: bee_audio
    bee_audio_id: bee_monitor
    hive_state:
      name: "Hive State"
      id: hive_state

switch:
  # Sensor power switch - controls power to all sensors via GPIO
  # On FeatherS3D this is LDO2 (GPIO39), automatically off during deep sleep
  - platform: gpio
    id: sensor_power
    pin: ${sensor_power_pin}
    name: "Sensor Power"
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
      - script.execute: ota_mode_timeout
    on_turn_off:
      - deep_sleep.allow: deep_sleep_control
      - script.stop: ota_mode_timeout

script:
  # Guards against a forgotten helper: clears it in Home Assistant so the next
  # wake goes straight back to sleep. Needs "Allow the device to perform Home
  # Assistant actions" enabled on the ESPHome integration entry.
  - id: ota_mode_timeout
    mode: restart
    then:
      - delay: ${ota_mode_max_awake}
      - logger.log: "OTA mode timed out - clearing helper and allowing sleep"
      - homeassistant.action:
          action: input_boolean.turn_off
          data:
            entity_id: ${ota_mode_entity}
      - switch.turn_off: prevent_deep_sleep
      - script.stop: collect_and_sleep
      - script.execute: collect_and_sleep

  - id: collect_and_sleep
    then:
      - logger.log: "Starting measurement cycle"
      - wait_until:
          condition:
            wifi.connected:
          timeout: 10s
      - component.update: bee_monitor
      # NAU7802 produces a sample every 100ms at the default 10 SPS
      - repeat:
          count: 7
          then:
            - component.update: hive_weight
            - delay: 120ms
      - component.update: hive_climate
      - component.update: ina226_solar
      - component.update: fuel_gauge
      - wait_until:
          condition:
            api.connected:
          timeout: 10s
      - wait_until:
          condition:
            lambda: return id(ota_mode).has_state();
          timeout: 3s
      - delay: 300ms
      - if:
          condition:
            switch.is_on: prevent_deep_sleep
          then:
            # Sensor rail stays on: power cycling would lose NAU7802 register
            # state (gain, LDO, calibration) which is only set in setup()
            - logger.log: "OTA mode - staying awake"
            - delay: 5min
            - script.execute: collect_and_sleep
          else:
            - switch.turn_off: sensor_power
            - logger.log: "BeeHive: Entering deep sleep"
            - deep_sleep.enter: deep_sleep_control
