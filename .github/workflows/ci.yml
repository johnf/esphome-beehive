name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ESPHome
        run: pip install esphome

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('example.yaml', 'beehive-monitor.yaml') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: ci-ssid
          wifi_password: ci-password
          EOF

      - name: Validate configuration
        run: esphome config example.yaml

      - name: Compile firmware
        run: esphome compile example.yaml
