name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ESPHome
        run: pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('example.yaml', 'beehive-monitor.yaml') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: ci-ssid
          wifi_password: ci-password
          EOF

      - name: Validate configuration
        run: esphome config example.yaml

      - name: Compile firmware
        run: esphome compile example.yaml

  kicad:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6
      options: --user root
    strategy:
      matrix:
        board: [main, hive]
    steps:
      - uses: actions/checkout@v4

      - name: ERC
        run: >
          kicad-cli sch erc --exit-code-violations --severity-all
          -o erc.rpt kicad/${{ matrix.board }}/beehive-${{ matrix.board }}.kicad_sch
          || { cat erc.rpt; exit 1; }

      - name: Export schematic and BOM
        run: |
          kicad-cli sch export pdf -o beehive-${{ matrix.board }}.pdf kicad/${{ matrix.board }}/beehive-${{ matrix.board }}.kicad_sch
          kicad-cli sch export bom -o beehive-${{ matrix.board }}-bom.csv kicad/${{ matrix.board }}/beehive-${{ matrix.board }}.kicad_sch

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-${{ matrix.board }}
          path: |
            erc.rpt
            beehive-${{ matrix.board }}.pdf
            beehive-${{ matrix.board }}-bom.csv
