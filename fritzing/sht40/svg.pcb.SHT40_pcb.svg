<?xml version='1.0' encoding='UTF-8' standalone='no'?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  height="0.3937in"
  id="svg1"
  version="1.2"
  viewBox="0 0 137.5 393.7"
  width="0.1375in">
  <desc id="desc1">
    <referenceFile>SHT40_pcb.svg</referenceFile>
  </desc>
  <g id="silkscreen">
    <!-- Board outline -->
    <rect x="5" y="5" width="127.5" height="383.7" rx="5" ry="5"
          fill="none" stroke="#000000" stroke-width="10"/>
    <!-- Pin 1 marker -->
    <circle cx="68.75" cy="46.85" r="5" fill="#000000" stroke="none"/>
  </g>
  <g id="copper1">
    <g id="copper0">
      <!-- 4 through-hole pads in a column, 100 unit (2.54mm) pitch -->
      <!-- Centred at x=68.75, starting y=46.85 -->
      <circle id="connector0pin" cx="68.75" cy="46.85" r="27.5"
              fill="none" stroke="#f7bd13" stroke-width="20"/>
      <circle id="connector1pin" cx="68.75" cy="146.85" r="27.5"
              fill="none" stroke="#f7bd13" stroke-width="20"/>
      <circle id="connector2pin" cx="68.75" cy="246.85" r="27.5"
              fill="none" stroke="#f7bd13" stroke-width="20"/>
      <circle id="connector3pin" cx="68.75" cy="346.85" r="27.5"
              fill="none" stroke="#f7bd13" stroke-width="20"/>
    </g>
  </g>
</svg>
