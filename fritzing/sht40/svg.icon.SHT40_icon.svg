<?xml version='1.0' encoding='UTF-8' standalone='no'?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  height="0.444444in"
  id="svg1"
  version="1.2"
  viewBox="0 0 32 32"
  width="0.444444in">
  <desc>
    <referenceFile>SHT40_icon.svg</referenceFile>
  </desc>
  <g id="icon">
    <!-- Purple PCB body -->
    <rect fill="#7B2D8E" x="2" y="1" width="28" height="30" rx="2" ry="2"/>
    <rect fill="none" stroke="#5E1D6E" stroke-width="1" x="2" y="1" width="28" height="30" rx="2" ry="2"/>

    <!-- Sensor IC -->
    <rect fill="#2A2A2A" x="14" y="10" width="10" height="10" rx="1" ry="1"/>

    <!-- Through-hole pads -->
    <circle fill="#C4A032" cx="6" cy="5" r="2"/>
    <circle fill="#C4A032" cx="6" cy="12" r="2"/>
    <circle fill="#C4A032" cx="6" cy="19" r="2"/>
    <circle fill="#C4A032" cx="6" cy="26" r="2"/>

    <!-- Label -->
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="5" font-weight="bold"
          text-anchor="middle" x="18" y="28">SHT40</text>
  </g>
</svg>
