<?xml version='1.0' encoding='UTF-8' standalone='no'?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  height="0.40000001in"
  id="svg1"
  version="1.2"
  viewBox="0 0 700 400"
  width="0.70000001in">
  <desc id="desc1">
    <referenceFile>SHT40_schematic.svg</referenceFile>
  </desc>
  <g id="schematic">
    <!-- IC box -->
    <rect fill="#ffffff" stroke="#000000" stroke-width="10"
          x="150" y="0" width="400" height="400"/>

    <!-- Part name -->
    <text text-anchor="middle" x="350" y="65"
          font-size="55" font-family="'Droid Sans'" fill="#000000" stroke="none">SHT40</text>

    <!-- Left side pin labels (VIN, GND) -->
    <text text-anchor="start" x="170" y="115"
          font-size="45" font-family="'Droid Sans'" fill="#787878" stroke="none">VIN</text>
    <text text-anchor="start" x="170" y="315"
          font-size="45" font-family="'Droid Sans'" fill="#787878" stroke="none">GND</text>

    <!-- Right side pin labels (SCL, SDA) -->
    <text text-anchor="end" x="530" y="115"
          font-size="45" font-family="'Droid Sans'" fill="#787878" stroke="none">SCL</text>
    <text text-anchor="end" x="530" y="315"
          font-size="45" font-family="'Droid Sans'" fill="#787878" stroke="none">SDA</text>

    <!-- Pin numbers -->
    <text text-anchor="middle" x="75" y="90"
          font-size="32" font-family="'Droid Sans'" fill="#8c8c8c" stroke="none">1</text>
    <text text-anchor="middle" x="75" y="290"
          font-size="32" font-family="'Droid Sans'" fill="#8c8c8c" stroke="none">2</text>
    <text text-anchor="middle" x="625" y="90"
          font-size="32" font-family="'Droid Sans'" fill="#8c8c8c" stroke="none">3</text>
    <text text-anchor="middle" x="625" y="290"
          font-size="32" font-family="'Droid Sans'" fill="#8c8c8c" stroke="none">4</text>

    <!-- Left side connector lines -->
    <!-- VIN (connector0) at y=100 (on grid) -->
    <line id="connector0pin" x1="0" x2="145" y1="100" y2="100"
          stroke="#787878" stroke-width="10" stroke-linecap="round"/>
    <rect id="connector0terminal" x="0" y="98" width="4" height="4"
          fill="none" stroke="none"/>

    <!-- GND (connector1) at y=300 (on grid) -->
    <line id="connector1pin" x1="0" x2="145" y1="300" y2="300"
          stroke="#787878" stroke-width="10" stroke-linecap="round"/>
    <rect id="connector1terminal" x="0" y="298" width="4" height="4"
          fill="none" stroke="none"/>

    <!-- Right side connector lines -->
    <!-- SCL (connector2) at y=100 (on grid) -->
    <line id="connector2pin" x1="700" x2="555" y1="100" y2="100"
          stroke="#787878" stroke-width="10" stroke-linecap="round"/>
    <rect id="connector2terminal" x="698" y="98" width="4" height="4"
          fill="none" stroke="none"/>

    <!-- SDA (connector3) at y=300 (on grid) -->
    <line id="connector3pin" x1="700" x2="555" y1="300" y2="300"
          stroke="#787878" stroke-width="10" stroke-linecap="round"/>
    <rect id="connector3terminal" x="698" y="298" width="4" height="4"
          fill="none" stroke="none"/>
  </g>
</svg>
