<?xml version='1.0' encoding='UTF-8' standalone='no'?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  height="0.3937in"
  id="Layer_1"
  version="1.2"
  viewBox="0 0 511.8 393.7"
  width="0.5118in">
  <desc>
    <referenceFile>SHT40_breadboard.svg</referenceFile>
  </desc>
  <g id="breadboard">
    <!-- PCB body - dark purple matching actual board -->
    <rect fill="#6A1B7A" x="30" y="0" width="481.8" height="393.7" rx="12" ry="12"/>
    <rect fill="none" stroke="#4A0E5A" stroke-width="4" x="30" y="0" width="481.8" height="393.7" rx="12" ry="12"/>

    <!-- Through-hole pads along left edge (silver/tin) -->
    <!-- Pin pitch: 100 units (2.54mm), 4 pins, span=300, centred in 393.7 -->
    <!-- First pin y = (393.7 - 300) / 2 = 46.85 -->
    <circle fill="#C0C0C0" stroke="#A0A0A0" stroke-width="3" cx="60" cy="46.85" r="20"/>
    <circle fill="#1A1A1A" cx="60" cy="46.85" r="9"/>
    <circle fill="#C0C0C0" stroke="#A0A0A0" stroke-width="3" cx="60" cy="146.85" r="20"/>
    <circle fill="#1A1A1A" cx="60" cy="146.85" r="9"/>
    <circle fill="#C0C0C0" stroke="#A0A0A0" stroke-width="3" cx="60" cy="246.85" r="20"/>
    <circle fill="#1A1A1A" cx="60" cy="246.85" r="9"/>
    <circle fill="#C0C0C0" stroke="#A0A0A0" stroke-width="3" cx="60" cy="346.85" r="20"/>
    <circle fill="#1A1A1A" cx="60" cy="346.85" r="9"/>

    <!-- Pin labels (white text, above/left of pads like on actual board) -->
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="45" text-anchor="start" x="90" y="62">VIN</text>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="45" text-anchor="start" x="90" y="162">GND</text>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="45" text-anchor="start" x="90" y="262">SCL</text>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="45" text-anchor="start" x="90" y="362">SDA</text>

    <!-- C1 - small capacitor, aligned with GND pin (y=146.85) -->
    <rect fill="#C4A050" x="222.5" y="131.85" width="50" height="30" rx="3" ry="3"/>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="24" text-anchor="start" x="285" y="155">C1</text>

    <!-- Large circular opening / sensor hole, top-right -->
    <circle fill="#4A0E5A" stroke="#888888" stroke-width="5" cx="410" cy="90" r="70"/>
    <circle fill="#333333" cx="410" cy="90" r="45"/>

    <!-- R1 - SMD resistor, aligned with SCL pin (y=246.85) -->
    <rect fill="#1A1A1A" x="220" y="234.35" width="55" height="25" rx="3" ry="3"/>
    <rect fill="#C0C0C0" x="220" y="234.35" width="12" height="25" rx="2" ry="2"/>
    <rect fill="#C0C0C0" x="263" y="234.35" width="12" height="25" rx="2" ry="2"/>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="24" text-anchor="start" x="285" y="255">R1</text>

    <!-- R2 - SMD resistor, aligned with SDA pin (y=346.85) -->
    <rect fill="#1A1A1A" x="220" y="334.35" width="55" height="25" rx="3" ry="3"/>
    <rect fill="#C0C0C0" x="220" y="334.35" width="12" height="25" rx="2" ry="2"/>
    <rect fill="#C0C0C0" x="263" y="334.35" width="12" height="25" rx="2" ry="2"/>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="24" text-anchor="start" x="285" y="355">R2</text>

    <!-- U1 - SHT40 sensor IC, bottom-right corner between SCL and SDA -->
    <rect fill="#2A2A2A" x="380" y="257" width="80" height="80" rx="5" ry="5"/>
    <!-- Pin 1 dot on IC -->
    <circle fill="#666666" cx="395" cy="272" r="5"/>
    <text fill="#FFFFFF" font-family="'Droid Sans'" font-size="24" text-anchor="start" x="465" y="305">U1</text>

    <!-- Connector pins (invisible clickable areas) -->
    <rect fill="none" id="connector0pin" x="50" y="36.85" width="20" height="20"/>
    <rect fill="none" id="connector1pin" x="50" y="136.85" width="20" height="20"/>
    <rect fill="none" id="connector2pin" x="50" y="236.85" width="20" height="20"/>
    <rect fill="none" id="connector3pin" x="50" y="336.85" width="20" height="20"/>
  </g>
</svg>
